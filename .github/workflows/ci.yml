name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          npm run check
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Security audit
        run: npm run audit
